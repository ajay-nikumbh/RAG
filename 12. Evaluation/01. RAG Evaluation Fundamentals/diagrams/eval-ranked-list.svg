<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="eval-ranked-list-title eval-ranked-list-desc">
<title id="eval-ranked-list-title">Ranked list with the relevant chunk at rank 3</title>
