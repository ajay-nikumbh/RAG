<text xml:space="preserve" x="40.0" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">rank 3</text>
<rect x="110" y="148" width="200" height="32" rx="6" fill="#0066cc" stroke="#0066cc" stroke-width="1.4"/>
