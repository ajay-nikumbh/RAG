<text xml:space="preserve" x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">Retrieval evaluation looks at the ranked list</text>
<text xml:space="preserve" x="40.0" y="86.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">rank 1</text>
<rect x="110" y="64" width="200" height="32" rx="6" fill="#ffffff" stroke="#cecfcf" stroke-width="1.4"/>
