<text xml:space="preserve" x="40.0" y="254.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">rank 5</text>
<rect x="110" y="232" width="200" height="32" rx="6" fill="#ffffff" stroke="#cecfcf" stroke-width="1.4"/>
