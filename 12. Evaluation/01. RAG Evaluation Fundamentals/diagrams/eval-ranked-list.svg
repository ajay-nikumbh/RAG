<text xml:space="preserve" x="340.0" y="188.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#161f34" text-anchor="start">All relevant found?  yes (only D7)</text>
<text xml:space="preserve" x="24.0" y="282.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">Each question about the list becomes a metric: Hit Rate, MRR, Precision@K, Recall@K.</text>
