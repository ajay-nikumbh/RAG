<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="eval-rank-cutoff-title eval-rank-cutoff-desc">
<title id="eval-rank-cutoff-title">The right chunk is retrieved but falls below the cut-off</title>
<desc id="eval-rank-cutoff-desc">Illustration with the numbers from the text: rank 57 with Top K = 10, and rank 6 pushed to 32 with Top 5.</desc>
<rect width="820" height="330" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="819" height="329" rx="8" fill="none" stroke="#cecfcf"/>
<text xml:space="preserve" x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">Retrieved somewhere is not enough: it must be above the cut-off</text>
<text xml:space="preserve" x="24.0" y="68.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0066cc" text-anchor="start">Case C: retrieval failure</text>
<rect x="24" y="96" width="128.7" height="30" fill="#0066cc" opacity="0.18"/>
<rect x="24" y="96" width="772" height="30" fill="none" stroke="#cecfcf"/>
<line x1="152.7" y1="90" x2="152.7" y2="136" stroke="#161f34" stroke-width="2"/>
<text xml:space="preserve" x="158.7" y="146.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#161f34" text-anchor="start">cut-off: Top 10 goes to the LLM</text>
<circle cx="751.0" cy="111" r="8" fill="#b8915a"/>
<text xml:space="preserve" x="751.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b8915a" text-anchor="middle">rank 57</text>
<text xml:space="preserve" x="24.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#735a6c" text-anchor="start">Case D: reranking failure</text>
<rect x="24" y="212" width="96.5" height="30" fill="#0066cc" opacity="0.18"/>
<rect x="24" y="212" width="772" height="30" fill="none" stroke="#cecfcf"/>
<line x1="120.5" y1="206" x2="120.5" y2="252" stroke="#161f34" stroke-width="2"/>
<text xml:space="preserve" x="126.5" y="262.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#161f34" text-anchor="start">cut-off: Top 5 goes to the LLM</text>
<circle cx="130.2" cy="227" r="8" fill="#40668d"/>
<text xml:space="preserve" x="130.2" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#40668d" text-anchor="middle">rank 6</text>
<circle cx="632.0" cy="227" r="8" fill="#b8915a"/>
<text xml:space="preserve" x="632.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b8915a" text-anchor="middle">rank 32</text>
<path d="M130.2,238 V252 H632.0 V242" fill="none" stroke="#735a6c" stroke-width="1.6"/>
<text xml:space="preserve" x="381.1" y="264.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#735a6c" text-anchor="middle">reranker moves it down</text>
<text xml:space="preserve" x="24.0" y="312.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">Shaded area = what the LLM sees. Both chunks exist in the index but never reach the model.</text>
</svg>
