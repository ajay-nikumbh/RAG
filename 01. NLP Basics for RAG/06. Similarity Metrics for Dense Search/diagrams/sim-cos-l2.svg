<text xml:space="preserve" x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">A = [1, 0], B = [10, 0]: cosine 1, distance 9</text>
<clipPath id="sim-cos-l2-clip1"><rect x="24" y="56" width="572" height="200" rx="6"/></clipPath>
