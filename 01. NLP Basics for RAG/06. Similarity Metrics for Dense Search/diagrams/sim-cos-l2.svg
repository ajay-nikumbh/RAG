<text xml:space="preserve" x="536.7" y="142.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#40668d" text-anchor="end">B = [10, 0]</text>
<line x1="53.6" y1="156.0" x2="94.1" y2="156.0" stroke="#0066cc" stroke-width="4"/>
<polygon points="102.9,156.0 92.7,160.1 92.7,151.9" fill="#0066cc"/>
<text xml:space="preserve" x="96.9" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">A = [1, 0]</text>
<line x1="102.9" y1="121.5" x2="546.7" y2="121.5" stroke="#735a6c" stroke-width="2.2" stroke-dasharray="6,4"/>
<line x1="102.9" y1="131.3" x2="102.9" y2="111.6" stroke="#735a6c" stroke-width="2"/>
