<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-labelledby="sim-cos-l2-title sim-cos-l2-desc">
<title id="sim-cos-l2-title">Cosine 1, Euclidean 9</title>
<desc id="sim-cos-l2-desc">A = [1, 0] and B = [10, 0] point the same way (cosine 1) but their tips are 9 apart.</desc>
