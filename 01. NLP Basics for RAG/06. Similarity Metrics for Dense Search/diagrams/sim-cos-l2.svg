<line x1="24" y1="304" x2="50" y2="304" stroke="#0066cc" stroke-width="2.4"/>
<text xml:space="preserve" x="58.0" y="308.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">cosine sees one direction</text>
