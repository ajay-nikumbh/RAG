<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 510" width="620" height="510" role="img" aria-labelledby="sim-three-docs-title sim-three-docs-desc">
<title id="sim-three-docs-title">Q, D1, D2, D3 under three metrics</title>
<desc id="sim-three-docs-desc">D1 matches Q exactly, D2 points almost the same way but is three times longer, D3 is orthogonal.</desc>
<rect width="620" height="510" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="619" height="509" rx="8" fill="none" stroke="#cecfcf"/>
<text xml:space="preserve" x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">Q = [1, 0] against D1, D2, D3</text>
<clipPath id="sim-three-docs-clip1"><rect x="24" y="56" width="572" height="330" rx="6"/></clipPath>
<rect x="24" y="56" width="572" height="330" rx="6" fill="#f3f3f4"/>
<line x1="105.7" y1="56" x2="105.7" y2="386" stroke="#cecfcf" stroke-width="0.6"/>
<line x1="241.9" y1="56" x2="241.9" y2="386" stroke="#cecfcf" stroke-width="0.6"/>
<line x1="378.1" y1="56" x2="378.1" y2="386" stroke="#cecfcf" stroke-width="0.6"/>
<line x1="514.3" y1="56" x2="514.3" y2="386" stroke="#cecfcf" stroke-width="0.6"/>
<line x1="24" y1="295.9" x2="596" y2="295.9" stroke="#cecfcf" stroke-width="0.6"/>
<line x1="24" y1="159.7" x2="596" y2="159.7" stroke="#cecfcf" stroke-width="0.6"/>
<line x1="24" y1="295.9" x2="596" y2="295.9" stroke="#4f5d73" stroke-width="1"/>
<line x1="105.7" y1="56" x2="105.7" y2="386" stroke="#4f5d73" stroke-width="1"/>
<line x1="105.7" y1="295.9" x2="105.7" y2="168.5" stroke="#735a6c" stroke-width="2.4"/>
<polygon points="105.7,159.7 109.8,169.9 101.6,169.9" fill="#735a6c"/>
<text xml:space="preserve" x="115.7" y="163.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#735a6c" text-anchor="start">D3 = [0, 1]</text>
<line x1="105.7" y1="295.9" x2="505.5" y2="255.9" stroke="#40668d" stroke-width="2.4"/>
<polygon points="514.3,255.0 504.5,260.1 503.7,252.0" fill="#40668d"/>
<text xml:space="preserve" x="504.3" y="243.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#40668d" text-anchor="end">D2 = [3, 0.3]</text>
<line x1="105.7" y1="295.9" x2="233.1" y2="295.9" stroke="#0066cc" stroke-width="4.4"/>
<polygon points="241.9,295.9 231.7,300.0 231.7,291.8" fill="#0066cc"/>
<text xml:space="preserve" x="237.9" y="319.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">Q = D1 = [1, 0]</text>
<line x1="241.9" y1="295.9" x2="514.3" y2="255.0" stroke="#4f5d73" stroke-width="1.4" stroke-dasharray="4,3"/>
<line x1="241.9" y1="295.9" x2="105.7" y2="159.7" stroke="#4f5d73" stroke-width="1.4" stroke-dasharray="4,3"/>
<text xml:space="preserve" x="378.1" y="252.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4f5d73" text-anchor="middle">L2 2.02</text>
<text xml:space="preserve" x="190.2" y="211.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4f5d73" text-anchor="start">L2 1.41</text>
<text xml:space="preserve" x="24.0" y="412.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="start">cosine (higher better):  D1 1.000   D2 0.995   D3 0.000</text>
<text xml:space="preserve" x="24.0" y="432.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="start">dot    (higher better):  D2 3.0     D1 1.0     D3 0.0</text>
<text xml:space="preserve" x="24.0" y="452.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="start">L2     (lower better):   D1 0.00    D3 1.41    D2 2.02</text>
<text xml:space="preserve" x="24.0" y="480.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">Cosine and Euclidean pick D1; dot product picks D2 because it is longer.</text>
</svg>
