<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="sim-norm-rank-title sim-norm-rank-desc">
<title id="sim-norm-rank-title">Normalization changes the ranking</title>
<desc id="sim-norm-rank-desc">Raw dot product prefers D2 = [10, 1] for its length; after normalization D1 = [1, 0] matches Q exactly.</desc>
<rect width="820" height="400" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="819" height="399" rx="8" fill="none" stroke="#cecfcf"/>
<text xml:space="preserve" x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">Q = [1, 0]: raw dot picks D2, cosine picks D1</text>
<clipPath id="sim-norm-rank-clip1"><rect x="24" y="56" width="380" height="250" rx="6"/></clipPath>
<rect x="24" y="56" width="380" height="250" rx="6" fill="#f3f3f4"/>
<line x1="24" y1="207.7" x2="404" y2="207.7" stroke="#4f5d73" stroke-width="1"/>
<line x1="44.0" y1="56" x2="44.0" y2="306" stroke="#4f5d73" stroke-width="1"/>
<text xml:space="preserve" x="214.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="middle">Raw vectors: Q·D2 = 10, Q·D1 = 1</text>
<line x1="44.0" y1="207.7" x2="368.6" y2="175.2" stroke="#735a6c" stroke-width="2.4"/>
<polygon points="377.3,174.3 367.6,179.4 366.8,171.3" fill="#735a6c"/>
<text xml:space="preserve" x="367.3" y="162.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#735a6c" text-anchor="end">D2 = [10, 1]</text>
<line x1="44.0" y1="207.7" x2="68.5" y2="207.7" stroke="#0066cc" stroke-width="4"/>
<polygon points="77.3,207.7 67.1,211.7 67.1,203.6" fill="#0066cc"/>
<text xml:space="preserve" x="85.3" y="229.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">Q = D1 = [1, 0]</text>
<clipPath id="sim-norm-rank-clip2"><rect x="416" y="56" width="380" height="250" rx="6"/></clipPath>
<rect x="416" y="56" width="380" height="250" rx="6" fill="#f3f3f4"/>
<line x1="416" y1="223.8" x2="796" y2="223.8" stroke="#4f5d73" stroke-width="1"/>
<line x1="492.0" y1="56" x2="492.0" y2="306" stroke="#4f5d73" stroke-width="1"/>
<text xml:space="preserve" x="606.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="middle">Unit vectors: cos(Q, D1) = 1, cos(Q, D2) = 0.995</text>
<circle cx="492.0" cy="223.8" r="190.0" fill="none" stroke="#b8915a" stroke-width="1.4" stroke-dasharray="5,4" clip-path="url(#sim-norm-rank-clip2)"/>
<line x1="492.0" y1="223.8" x2="672.3" y2="205.7" stroke="#735a6c" stroke-width="2.4"/>
<polygon points="681.1,204.8 671.3,209.9 670.5,201.8" fill="#735a6c"/>
<text xml:space="preserve" x="689.1" y="194.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#735a6c" text-anchor="start">D2 / ‖D2‖</text>
<line x1="492.0" y1="223.8" x2="673.2" y2="223.8" stroke="#0066cc" stroke-width="3.4"/>
<polygon points="682.0,223.8 671.8,227.8 671.8,219.7" fill="#0066cc"/>
<text xml:space="preserve" x="690.0" y="245.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">Q = D1</text>
<line x1="24" y1="374" x2="50" y2="374" stroke="#0066cc" stroke-width="2.4"/>
<text xml:space="preserve" x="58.0" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">Q and D1</text>
<line x1="143.6" y1="374" x2="169.6" y2="374" stroke="#735a6c" stroke-width="2.4"/>
<text xml:space="preserve" x="177.6" y="378.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">D2</text>
</svg>
