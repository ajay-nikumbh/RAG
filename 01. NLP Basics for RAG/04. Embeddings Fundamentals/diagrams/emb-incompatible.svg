<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="emb-incompatible-title emb-incompatible-desc">
<title id="emb-incompatible-title">Two models, two different maps</title>
<desc id="emb-incompatible-desc">The same three texts land in different places in model A and model B, so their vectors cannot be compared.</desc>
<rect width="780" height="380" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="779" height="379" rx="8" fill="none" stroke="#cecfcf"/>
<text x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">Same 768 dimensions, different maps</text>
<clipPath id="emb-incompatible-clip1"><rect x="24" y="56" width="354" height="250" rx="6"/></clipPath>
<rect x="24" y="56" width="354" height="250" rx="6" fill="#f3f3f4"/>
<line x1="24" y1="181.0" x2="378" y2="181.0" stroke="#4f5d73" stroke-width="1"/>
<line x1="201.0" y1="56" x2="201.0" y2="306" stroke="#4f5d73" stroke-width="1"/>
<text x="201.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="middle">Model A</text>
<circle cx="294.8" cy="110.7" r="6" fill="#0066cc" stroke="#0066cc" stroke-width="1.6"/>
<text x="304.8" y="102.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0066cc" text-anchor="start">annual leave</text>
<circle cx="318.2" cy="141.9" r="6" fill="#0066cc" stroke="#0066cc" stroke-width="1.6"/>
<text x="328.2" y="133.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0066cc" text-anchor="start">vacation</text>
<circle cx="99.4" cy="243.5" r="6" fill="#735a6c" stroke="#735a6c" stroke-width="1.6"/>
<text x="109.4" y="235.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#735a6c" text-anchor="start">database</text>
<clipPath id="emb-incompatible-clip2"><rect x="402" y="56" width="354" height="250" rx="6"/></clipPath>
<rect x="402" y="56" width="354" height="250" rx="6" fill="#f3f3f4"/>
<line x1="402" y1="181.0" x2="756" y2="181.0" stroke="#4f5d73" stroke-width="1"/>
<line x1="579.0" y1="56" x2="579.0" y2="306" stroke="#4f5d73" stroke-width="1"/>
<text x="579.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="middle">Model B</text>
<circle cx="532.1" cy="274.8" r="6" fill="#0066cc" stroke="#0066cc" stroke-width="1.6"/>
<text x="542.1" y="266.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0066cc" text-anchor="start">annual leave</text>
<circle cx="493.1" cy="259.1" r="6" fill="#0066cc" stroke="#0066cc" stroke-width="1.6"/>
<text x="503.1" y="251.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0066cc" text-anchor="start">vacation</text>
<circle cx="672.8" cy="95.1" r="6" fill="#735a6c" stroke="#735a6c" stroke-width="1.6"/>
<text x="682.8" y="87.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#735a6c" text-anchor="start">database</text>
<text x="24.0" y="352.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">A query vector from model A dropped into an index built with model B points at the wrong region.</text>
</svg>
