<line x1="129.2" y1="296" x2="155.2" y2="296" stroke="#735a6c" stroke-width="2.4"/>
<text xml:space="preserve" x="163.2" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">history</text>
<line x1="241.6" y1="296" x2="267.6" y2="296" stroke="#b8915a" stroke-width="2.4"/>
