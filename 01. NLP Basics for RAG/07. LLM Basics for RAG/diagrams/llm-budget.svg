<line x1="339.6" y1="296" x2="365.6" y2="296" stroke="#0066cc" stroke-width="2.4"/>
<text xml:space="preserve" x="373.6" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">retrieved</text>
<line x1="466.40000000000003" y1="296" x2="492.40000000000003" y2="296" stroke="#7c8f6f" stroke-width="2.4"/>
<text xml:space="preserve" x="500.4" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">output reserve</text>
