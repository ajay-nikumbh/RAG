<rect x="436" y="164" width="60" height="36" fill="#0066cc" opacity="0.62" stroke="#cecfcf"/>
<text xml:space="preserve" x="466.0" y="186.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">1</text>
<rect x="498" y="164" width="60" height="36" fill="#0066cc" opacity="1.00" stroke="#cecfcf"/>
<text xml:space="preserve" x="528.0" y="186.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">2</text>
<text xml:space="preserve" x="24.0" y="262.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">Darker cell = higher count. "salary" appears twice in D2, so its cell holds 2.</text>
