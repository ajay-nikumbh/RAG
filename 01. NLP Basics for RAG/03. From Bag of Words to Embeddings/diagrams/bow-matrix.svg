<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" width="620" height="290" role="img" aria-labelledby="bow-matrix-title bow-matrix-desc">
<title id="bow-matrix-title">Document-term count matrix</title>
<desc id="bow-matrix-desc">Two documents as Bag-of-Words rows over the vocabulary annual, employee, leave, policy, salary.</desc>
<rect width="620" height="290" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="619" height="289" rx="8" fill="none" stroke="#cecfcf"/>
<text xml:space="preserve" x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">Bag of Words: one row per document, one column per word</text>
<text xml:space="preserve" x="24.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#161f34" text-anchor="start">D1</text>
<text xml:space="preserve" x="24.0" y="140.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f5d73" text-anchor="start">employee annual leave policy</text>
<rect x="250" y="108" width="60" height="36" fill="#0066cc" opacity="0.62" stroke="#cecfcf"/>
<text xml:space="preserve" x="280.0" y="130.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">1</text>
<text xml:space="preserve" x="280.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f5d73" text-anchor="middle">annual</text>
<rect x="312" y="108" width="60" height="36" fill="#0066cc" opacity="0.62" stroke="#cecfcf"/>
<text xml:space="preserve" x="342.0" y="130.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">1</text>
<text xml:space="preserve" x="342.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f5d73" text-anchor="middle">employee</text>
<rect x="374" y="108" width="60" height="36" fill="#0066cc" opacity="0.62" stroke="#cecfcf"/>
<text xml:space="preserve" x="404.0" y="130.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">1</text>
<text xml:space="preserve" x="404.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f5d73" text-anchor="middle">leave</text>
