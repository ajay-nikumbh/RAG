<text xml:space="preserve" x="466.0" y="130.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">1</text>
<text xml:space="preserve" x="466.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f5d73" text-anchor="middle">policy</text>
<rect x="498" y="108" width="60" height="36" fill="#f3f3f4" stroke="#cecfcf"/>
<text xml:space="preserve" x="528.0" y="130.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">0</text>
<text xml:space="preserve" x="528.0" y="100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f5d73" text-anchor="middle">salary</text>
<text xml:space="preserve" x="24.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#161f34" text-anchor="start">D2</text>
<text xml:space="preserve" x="24.0" y="196.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#4f5d73" text-anchor="start">employee salary salary policy</text>
<rect x="250" y="164" width="60" height="36" fill="#f3f3f4" stroke="#cecfcf"/>
<text xml:space="preserve" x="280.0" y="186.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">0</text>
<rect x="312" y="164" width="60" height="36" fill="#0066cc" opacity="0.62" stroke="#cecfcf"/>
<text xml:space="preserve" x="342.0" y="186.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#161f34" text-anchor="middle">1</text>
