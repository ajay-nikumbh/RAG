<title id="bow-bag-title">dog bites man and man bites dog give the same bag</title>
<desc id="bow-bag-desc">Both sentences produce the BoW vector bites 1, dog 1, man 1. Real all-MiniLM-L6-v2 cosine is 0.907.</desc>
