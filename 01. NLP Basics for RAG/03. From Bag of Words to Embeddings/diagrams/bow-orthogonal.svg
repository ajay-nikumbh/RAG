<polygon points="95.5,319.5 100.6,309.7 105.9,315.9" fill="#0066cc"/>
<text xml:space="preserve" x="342.0" y="259.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#40668d" text-anchor="end">dog</text>
<text xml:space="preserve" x="199.9" y="93.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#735a6c" text-anchor="start">car</text>
<text xml:space="preserve" x="106.0" y="327.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">cat</text>
<polyline points="210.3,238.6 210.3,217.7 189.4,217.7" fill="none" stroke="#4f5d73" stroke-width="1.2"/>
<polyline points="210.3,238.6 194.5,252.2 173.6,252.2" fill="none" stroke="#4f5d73" stroke-width="1.2"/>
<polyline points="189.4,217.7 173.6,231.4 173.6,252.2" fill="none" stroke="#4f5d73" stroke-width="1.2"/>
<text xml:space="preserve" x="270.3" y="157.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4f5d73" text-anchor="middle">every pair at 90°</text>
<text xml:space="preserve" x="270.3" y="178.6" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="middle">cat·dog = cat·car = 0</text>
<clipPath id="bow-orthogonal-clip2"><rect x="420" y="56" width="376" height="300" rx="6"/></clipPath>
<rect x="420" y="56" width="376" height="300" rx="6" fill="#f3f3f4"/>
