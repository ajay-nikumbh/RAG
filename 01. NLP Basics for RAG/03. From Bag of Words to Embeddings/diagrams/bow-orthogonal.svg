<text xml:space="preserve" x="24.0" y="386.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">Left: one-hot gives no notion of closeness.</text>
<text xml:space="preserve" x="420.0" y="386.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">Right: real all-MiniLM-L6-v2 angles: dog is nearer to cat than car is.</text>
</svg>
