<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-labelledby="bow-orthogonal-title bow-orthogonal-desc">
<title id="bow-orthogonal-title">One-hot axes are all at 90 degrees; learned vectors are not</title>
<desc id="bow-orthogonal-desc">Left: one-hot cat, dog and car lie on three perpendicular axes. Right: real all-MiniLM-L6-v2 angles, cos(cat, dog) = 0.661, cos(cat, car) = 0.463.</desc>
<rect width="820" height="420" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="819" height="419" rx="8" fill="none" stroke="#cecfcf"/>
<text xml:space="preserve" x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">One-hot (left) vs learned embedding (right)</text>
<clipPath id="bow-orthogonal-clip1"><rect x="24" y="56" width="370" height="300" rx="6"/></clipPath>
<rect x="24" y="56" width="370" height="300" rx="6" fill="#f3f3f4"/>
