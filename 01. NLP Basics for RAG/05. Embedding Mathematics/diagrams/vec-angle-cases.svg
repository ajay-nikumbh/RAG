<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="vec-angle-cases-title vec-angle-cases-desc">
<title id="vec-angle-cases-title">Angle decides the sign of the dot product</title>
<desc id="vec-angle-cases-desc">Same direction gives cosine near 1, perpendicular gives 0, opposite gives -1.</desc>
<rect width="840" height="360" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="839" height="359" rx="8" fill="none" stroke="#cecfcf"/>
<text x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">The angle θ between A and B</text>
<clipPath id="vec-angle-cases-clip1"><rect x="24" y="56" width="248" height="220" rx="6"/></clipPath>
