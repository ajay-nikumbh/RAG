<text x="420.0" y="298.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="middle">Perpendicular: cos θ = 0</text>
<line x1="420.0" y1="190.4" x2="499.8" y2="190.4" stroke="#161f34" stroke-width="2.2"/>
