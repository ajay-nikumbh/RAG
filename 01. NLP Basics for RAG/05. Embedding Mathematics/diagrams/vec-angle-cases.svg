<text x="148.0" y="298.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="middle">Same direction: cos θ ≈ 1</text>
<line x1="148.0" y1="190.4" x2="227.8" y2="190.4" stroke="#161f34" stroke-width="2.2"/>
<polygon points="236.6,190.4 226.4,194.4 226.4,186.3" fill="#161f34"/>
