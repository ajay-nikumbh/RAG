<text x="239.2" y="152.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">B</text>
<polyline points="179.0,190.4 179.0,189.9 179.0,189.5 179.0,189.0 178.9,188.6 178.9,188.1 178.9,187.7 178.8,187.2 178.8,186.8 178.7,186.3 178.7,185.9 178.6,185.4 178.5,185.0 178.4,184.5 178.4,184.1 178.3,183.6 178.2,183.2 178.1,182.8 177.9,182.3 177.8,181.9 177.7,181.5 177.6,181.0 177.4,180.6 177.3,180.2 177.1,179.8" fill="none" stroke="#b8915a" stroke-width="1.8"/>
