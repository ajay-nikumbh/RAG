<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="vec-projection-title vec-projection-desc">
<title id="vec-projection-title">Projection of A onto B</title>
<desc id="vec-projection-desc">The dot product with a unit vector B is the length of A's shadow on B.</desc>
<rect width="560" height="420" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="559" height="419" rx="8" fill="none" stroke="#cecfcf"/>
<text x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">proj_B(A) = (A · B) B  when B has length 1</text>
<clipPath id="vec-projection-clip1"><rect x="24" y="56" width="512" height="310" rx="6"/></clipPath>
<rect x="24" y="56" width="512" height="310" rx="6" fill="#f3f3f4"/>
<line x1="24" y1="324.1" x2="536" y2="324.1" stroke="#4f5d73" stroke-width="1"/>
<line x1="125.0" y1="56" x2="125.0" y2="366" stroke="#4f5d73" stroke-width="1"/>
<line x1="125.0" y1="324.1" x2="450.1" y2="242.8" stroke="#4f5d73" stroke-width="1" stroke-dasharray="2,4"/>
<line x1="125.0" y1="324.1" x2="303.6" y2="113.0" stroke="#161f34" stroke-width="2.6"/>
<polygon points="309.3,106.3 305.8,116.7 299.6,111.4" fill="#161f34"/>
<text x="317.3" y="106.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#161f34" text-anchor="start">A</text>
<line x1="309.3" y1="106.3" x2="349.7" y2="267.9" stroke="#4f5d73" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="125.0" y1="324.1" x2="341.2" y2="270.1" stroke="#0066cc" stroke-width="3.2"/>
<polygon points="349.7,267.9 340.8,274.4 338.8,266.4" fill="#0066cc"/>
<text x="282.3" y="314.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0066cc" text-anchor="start">shadow length = A · B ≈ 2.76</text>
<line x1="125.0" y1="324.1" x2="197.7" y2="305.9" stroke="#735a6c" stroke-width="2.4"/>
<polygon points="206.3,303.8 197.4,310.2 195.4,302.3" fill="#735a6c"/>
<text x="204.3" y="289.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#735a6c" text-anchor="end">B (unit)</text>
<line x1="24" y1="394" x2="50" y2="394" stroke="#0066cc" stroke-width="2.4"/>
<text x="58.0" y="398.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">projection of A on B</text>
<line x1="230.0" y1="394" x2="256.0" y2="394" stroke="#4f5d73" stroke-width="2.4" stroke-dasharray="5,4"/>
<text x="264.0" y="398.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">drop at 90°</text>
</svg>
