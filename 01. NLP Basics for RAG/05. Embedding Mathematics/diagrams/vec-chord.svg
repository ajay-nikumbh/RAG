<text x="58.0" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#4f5d73" text-anchor="start">distance² = 0.3974 = 2 − 2 × 0.8013</text>
