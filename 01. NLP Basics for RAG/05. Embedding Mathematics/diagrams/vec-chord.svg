<title id="vec-chord-title">Cosine and Euclidean distance on the unit circle</title>
<desc id="vec-chord-desc">Two unit vectors with cosine 0.8013 are 36.7 degrees apart and their tips are 0.630 apart.</desc>
<rect width="560" height="450" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="559" height="449" rx="8" fill="none" stroke="#cecfcf"/>
<text x="24.0" y="32.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#161f34" text-anchor="start">Unit vectors: ‖A − B‖² = 2 − 2 cos θ</text>
<clipPath id="vec-chord-clip1"><rect x="24" y="56" width="512" height="340" rx="6"/></clipPath>
